<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Chat</title>
    <!-- Official Supabase v2 Library CDN Package -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #313338; /* Discord background */
            color: #dbdee1;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #status-bar {
            background-color: #2b2d31;
            padding: 10px 20px;
            font-size: 14px;
            border-bottom: 1px solid #1f2023;
            color: #949ba4;
        }
        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #23a55a;
            border-radius: 50%;
            margin-right: 5px;
        }
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            display: flex;
            flex-direction: column;
        }
        .meta {
            font-size: 12px;
            font-weight: bold;
            color: #f2f3f5;
            margin-bottom: 4px;
        }
        .text {
            font-size: 15px;
            color: #dbdee1;
            word-break: break-word;
        }
        /* Bottom Input Bar Container */
        #input-container {
            padding: 0 20px 24px 20px;
            background-color: #313338;
            display: flex;
            gap: 10px;
        }
        #message-input {
            flex: 1;
            background-color: #383a40;
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            color: #dbdee1;
            font-size: 16px;
            outline: none;
        }
        /* Big Send Button */
        #send-btn {
            background-color: #5865f2; /* Discord Blurple color */
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #send-btn:hover {
            background-color: #4752c4;
        }
    </style>
</head>
<body>

    <div id="status-bar">
        <span class="online-dot"></span> Online right now: <span id="online-list">Connecting...</span>
    </div>

    <div id="chat-window"></div>

    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type your message..." autofocus>
        <button id="send-btn">SEND</button>
    </div>

    <script>
        // 1. FIXED CONFIGURATION (Your ID is baked right into the URL link!)
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_ANON_KEY = "PASTE_YOUR_ACTUAL_LONG_ANON_KEY_HERE"; 
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Setup user nickname
        let username = localStorage.getItem('chat_username');
        if (!username) {
            username = prompt("Enter your nickname:") || "Anonymous";
            localStorage.setItem('chat_username', username);
        }

        const chatWindow = document.getElementById('chat-window');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-btn');
        const onlineList = document.getElementById('online-list');

        function appendMessage(msg) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<div class="meta">${msg.username}</div><div class="text">${msg.text}</div>`;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Load existing old messages from the cloud database
        async function loadMessages() {
            try {
                const { data } = await supabase
                    .from('messages')
                    .select('*')
                    .order('id', { ascending: true })
                    .limit(100);
                
                if (data) {
                    chatWindow.innerHTML = ''; // Wipe out previous text states
                    data.forEach(appendMessage);
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Send function to push data up to Supabase
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            messageInput.value = ''; // Clear box immediately

            // Insert message to your cloud server table database
            await supabase.from('messages').insert([{ username, text }]);
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Load database history on start
        loadMessages();

        // Listen for new live incoming messages from your friend
        supabase
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                appendMessage(payload.new);
            })
            .subscribe();

        // Track who is actively online right now
        const presenceChannel = supabase.channel('online-users');
        presenceChannel
            .on('presence', { event: 'sync' }, () => {
                const newState = presenceChannel.presenceState();
                const users =;
                for (const id in newState) {
                    newState[id].forEach(presence => {
                        if (!users.includes(presence.user)) {
                            users.push(presence.user);
                        }
                    });
                }
                onlineList.textContent = users.length > 0 ? users.join(', ') : "Nobody";
            })
            .subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await presenceChannel.track({ user: username });
                }
            });
    </script>
</body>
</html>
