<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #313338; /* Discord background */
            color: #dbdee1;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #status-bar {
            background-color: #2b2d31;
            padding: 10px 20px;
            font-size: 14px;
            border-bottom: 1px solid #1f2023;
            color: #949ba4;
        }
        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #23a55a;
            border-radius: 50%;
            margin-right: 5px;
        }
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            display: flex;
            flex-direction: column;
        }
        .meta {
            font-size: 12px;
            font-weight: bold;
            color: #f2f3f5;
            margin-bottom: 4px;
        }
        .text {
            font-size: 15px;
            color: #dbdee1;
            word-break: break-word;
        }
        /* Bottom Input Bar Container */
        #input-container {
            padding: 0 20px 24px 20px;
            background-color: #313338;
            display: flex;
            gap: 10px;
        }
        #message-input {
            flex: 1;
            background-color: #383a40;
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            color: #dbdee1;
            font-size: 16px;
            outline: none;
        }
        /* Big Send Button */
        #send-btn {
            background-color: #5865f2; /* Discord Blurple color */
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #send-btn:hover {
            background-color: #4752c4;
        }
    </style>
</head>
<body>

    <div id="status-bar">
        <span class="online-dot"></span> Online: <span id="online-list">You</span>
    </div>

    <div id="chat-window"></div>

    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type your message..." autofocus>
        <button id="send-btn">SEND</button>
    </div>

    <script>
        // Setup simple local nickname
        let username = localStorage.getItem('chat_username');
        if (!username) {
            username = prompt("Enter your nickname:") || "Anonymous";
            localStorage.setItem('chat_username', username);
        }

        const chatWindow = document.getElementById('chat-window');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-btn');
        const onlineList = document.getElementById('online-list');

        onlineList.textContent = username;

        // Core Send function
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            // Clear input box instantly
            messageInput.value = '';

            // Print directly onto screen layout
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<div class="meta">${username}</div><div class="text">${text}</div>`;
            chatWindow.appendChild(msgDiv);
            
            // Auto scroll down
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Action when button is clicked
        sendButton.addEventListener('click', sendMessage);

        // Action when Enter is tapped (as secondary fallback)
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
